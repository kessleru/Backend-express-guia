<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>O agregado Curso: raiz com dois value objects, e quem está fora só fala com a raiz</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="seta-vermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Fronteira do agregado -->
  <rect x="330" y="40" width="530" height="300" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="350" y="68" font-size="15" font-weight="700" fill="#14532d">Agregado Curso</text>
  <text x="350" y="88" font-size="12" fill="#166534">carregado inteiro · alterado por método · salvo inteiro</text>

  <rect x="380" y="118" width="210" height="120" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="485" y="144" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">Curso</text>
  <text x="485" y="163" text-anchor="middle" font-size="12" fill="#166534">entidade · RAIZ</text>
  <text x="485" y="187" text-anchor="middle" font-size="12" fill="#0f172a">id: 2</text>
  <text x="485" y="206" text-anchor="middle" font-size="12" fill="#0f172a">publicar()</text>
  <text x="485" y="224" text-anchor="middle" font-size="12" fill="#0f172a">garantirQuePodeSerRemovido()</text>

  <rect x="650" y="118" width="180" height="70" rx="12" fill="#ffffff" stroke="#16a34a"/>
  <text x="740" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Titulo</text>
  <text x="740" y="162" text-anchor="middle" font-size="12" fill="#166534">value object</text>
  <text x="740" y="178" text-anchor="middle" font-size="11" fill="#475569">"Express do zero"</text>

  <rect x="650" y="210" width="180" height="70" rx="12" fill="#ffffff" stroke="#16a34a"/>
  <text x="740" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CargaHoraria</text>
  <text x="740" y="254" text-anchor="middle" font-size="12" fill="#166534">value object</text>
  <text x="740" y="270" text-anchor="middle" font-size="11" fill="#475569">8h · bastaParaPublicar()</text>

  <line x1="590" y1="160" x2="646" y2="153" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="590" y1="210" x2="646" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Quem está fora -->
  <rect x="40" y="100" width="220" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Serviço de aplicação</text>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#1e3a8a">curso.publicar()</text>

  <rect x="40" y="200" width="220" height="62" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="150" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Repositório</text>
  <text x="150" y="246" text-anchor="middle" font-size="12" fill="#78350f">salvar(curso) inteiro</text>

  <line x1="260" y1="131" x2="376" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="260" y1="231" x2="376" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="282" y="187" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">✓ pela raiz</text>

  <!-- Acesso proibido: a curva é riscada no meio -->
  <path d="M150,262 C 170,330 520,370 646,262" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta-vermelha)"/>
  <circle cx="358" cy="328" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="350" y1="320" x2="366" y2="336" stroke="#dc2626" stroke-width="3"/>
  <line x1="366" y1="320" x2="350" y2="336" stroke="#dc2626" stroke-width="3"/>
  <text x="420" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">✗ ninguém de fora altera um value object direto: tudo passa pela raiz</text>
</svg>
