<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Arquitetura hexagonal: núcleo com portas, adaptadores condutores à esquerda e conduzidos à direita</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="seta-ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="110" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Lado condutor</text>
  <text x="110" y="60" text-anchor="middle" font-size="12" fill="#64748b">quem CHAMA o núcleo</text>
  <text x="790" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Lado conduzido</text>
  <text x="790" y="60" text-anchor="middle" font-size="12" fill="#64748b">quem o núcleo CHAMA</text>

  <!-- Hexágono: vértices laterais em x=240 e x=660, na altura y=280.
       As caixas internas foram posicionadas para caber DENTRO das bordas
       inclinadas (em y=242 a borda esquerda está em x≈262; a direita, x≈638). -->
  <polygon points="240,280 345,98 555,98 660,280 555,462 345,462" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
  <text x="450" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#14532d">NÚCLEO</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#166534">nucleo/ — não importa nada de fora</text>

  <!-- Porta de entrada -->
  <rect x="270" y="242" width="92" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="316" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">PORTA DE</text>
  <text x="316" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">ENTRADA</text>
  <text x="316" y="297" text-anchor="middle" font-size="11" fill="#1e3a8a">CatalogoDe</text>
  <text x="316" y="310" text-anchor="middle" font-size="11" fill="#1e3a8a">Cursos</text>

  <!-- A lógica -->
  <rect x="394" y="244" width="106" height="72" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <text x="447" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">catalogo.ts</text>
  <text x="447" y="287" text-anchor="middle" font-size="12" fill="#475569">regra das 2h,</text>
  <text x="447" y="302" text-anchor="middle" font-size="12" fill="#475569">título único</text>

  <!-- Portas de saída -->
  <rect x="530" y="236" width="96" height="88" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="578" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">PORTAS DE</text>
  <text x="578" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">SAÍDA</text>
  <text x="578" y="287" text-anchor="middle" font-size="11" fill="#78350f">Repositorio</text>
  <text x="578" y="299" text-anchor="middle" font-size="11" fill="#78350f">Cursos</text>
  <text x="578" y="316" text-anchor="middle" font-size="11" fill="#78350f">Notificador</text>

  <!-- Setas internas: entrada → lógica → saída -->
  <line x1="362" y1="280" x2="390" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="500" y1="280" x2="526" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Adaptadores condutores -->
  <rect x="30" y="140" width="160" height="58" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="110" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">HTTP</text>
  <text x="110" y="184" text-anchor="middle" font-size="12" fill="#475569">adaptadores/http</text>

  <rect x="30" y="250" width="160" height="58" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="110" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Linha de comando</text>
  <text x="110" y="294" text-anchor="middle" font-size="12" fill="#475569">adaptadores/cli</text>

  <rect x="30" y="360" width="160" height="58" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="110" y="385" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Teste</text>
  <text x="110" y="404" text-anchor="middle" font-size="12" fill="#475569">módulo 12</text>

  <line x1="190" y1="169" x2="266" y2="262" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="190" y1="279" x2="266" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="190" y1="389" x2="266" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <text x="200" y="262" font-size="12" font-weight="600" fill="#334155">chama</text>

  <!-- Adaptadores conduzidos -->
  <rect x="710" y="100" width="160" height="54" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="790" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Memória</text>
  <text x="790" y="141" text-anchor="middle" font-size="12" fill="#475569">adaptadores/memoria</text>

  <rect x="710" y="172" width="160" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="790" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">SQLite</text>
  <text x="790" y="213" text-anchor="middle" font-size="12" fill="#475569">módulo 09</text>

  <rect x="710" y="244" width="160" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="790" y="267" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Prisma</text>
  <text x="790" y="285" text-anchor="middle" font-size="12" fill="#475569">módulo 10</text>

  <rect x="710" y="340" width="160" height="54" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="790" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Console</text>
  <text x="790" y="381" text-anchor="middle" font-size="12" fill="#475569">adaptadores/console</text>

  <!-- As três implementações de banco apontam para a linha "RepositorioCursos";
       o console aponta para "Notificador". -->
  <line x1="710" y1="127" x2="630" y2="287" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-ambar)"/>
  <line x1="710" y1="199" x2="630" y2="290" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-ambar)"/>
  <line x1="710" y1="271" x2="630" y2="293" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-ambar)"/>
  <line x1="710" y1="367" x2="630" y2="313" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seta-ambar)"/>

  <text x="450" y="506" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Toda seta de import aponta para o núcleo. O núcleo só conhece as próprias portas.</text>
  <text x="450" y="530" text-anchor="middle" font-size="12" fill="#64748b">Seta tracejada = implementa a porta. Caixa tracejada = adaptador de outro módulo ou de teste.</text>
</svg>
