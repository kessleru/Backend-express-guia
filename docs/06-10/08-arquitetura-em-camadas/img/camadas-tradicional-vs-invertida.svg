<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Camadas tradicionais comparadas com camadas com a dependência invertida</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="seta-vermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="900" height="570" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Painel esquerdo: camadas tradicionais -->
  <text x="225" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Camadas tradicionais</text>
  <text x="225" y="62" text-anchor="middle" font-size="13" fill="#64748b">cada camada importa a de baixo</text>

  <rect x="95" y="90" width="260" height="62" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="225" y="117" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Apresentação</text>
  <text x="225" y="138" text-anchor="middle" font-size="13" fill="#475569">rotas, controllers</text>

  <rect x="95" y="215" width="260" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="225" y="242" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Negócio</text>
  <text x="225" y="263" text-anchor="middle" font-size="13" fill="#475569">services, com as regras</text>

  <rect x="95" y="340" width="260" height="62" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="225" y="367" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Dados</text>
  <text x="225" y="388" text-anchor="middle" font-size="13" fill="#475569">SQL, Prisma, driver do banco</text>

  <line x1="225" y1="152" x2="225" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <text x="236" y="186" font-size="12" fill="#475569">importa</text>
  <line x1="225" y1="277" x2="225" y2="335" stroke="#dc2626" stroke-width="2.5" marker-end="url(#seta-vermelha)"/>
  <text x="236" y="311" font-size="12" fill="#dc2626" font-weight="600">importa</text>

  <text x="225" y="520" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="600">A regra de negócio depende do banco.</text>
  <text x="225" y="542" text-anchor="middle" font-size="13" fill="#475569">Trocar o banco obriga a mexer em quem tem as regras.</text>

  <line x1="450" y1="30" x2="450" y2="545" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Painel direito: dependência invertida -->
  <text x="675" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Com a dependência invertida</text>
  <text x="675" y="62" text-anchor="middle" font-size="13" fill="#64748b">o que o módulo 08 faz</text>

  <rect x="545" y="90" width="260" height="62" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="675" y="117" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Apresentação</text>
  <text x="675" y="138" text-anchor="middle" font-size="13" fill="#475569">rotas/, controllers/</text>

  <rect x="545" y="200" width="260" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="675" y="227" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Negócio</text>
  <text x="675" y="248" text-anchor="middle" font-size="13" fill="#475569">servicos/</text>

  <rect x="545" y="310" width="260" height="62" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="675" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Domínio</text>
  <text x="675" y="357" text-anchor="middle" font-size="13" fill="#14532d">tipos + interface RepositorioCursos</text>

  <rect x="545" y="430" width="260" height="62" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="675" y="457" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Dados</text>
  <text x="675" y="478" text-anchor="middle" font-size="12" fill="#475569">repositorios/ · memória, SQLite…</text>

  <line x1="675" y1="152" x2="675" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#seta)"/>
  <text x="686" y="180" font-size="12" fill="#475569">importa</text>
  <line x1="675" y1="262" x2="675" y2="305" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta-verde)"/>
  <text x="686" y="290" font-size="12" fill="#15803d" font-weight="600">importa</text>
  <!-- A seta que inverteu: sai dos dados e sobe até o domínio -->
  <line x1="675" y1="430" x2="675" y2="377" stroke="#16a34a" stroke-width="2.5" marker-end="url(#seta-verde)"/>
  <text x="686" y="408" font-size="12" fill="#15803d" font-weight="600">importa e implementa ↑</text>

  <text x="675" y="520" text-anchor="middle" font-size="14" fill="#15803d" font-weight="600">Todos dependem do domínio.</text>
  <text x="675" y="542" text-anchor="middle" font-size="13" fill="#475569">A seta dos dados agora aponta para cima.</text>
</svg>
